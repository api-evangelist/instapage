  not a standalone feed. There is no RSS/Atom, no per-entry permalink and no version number attached
  to entries — the surface is versioned only as `v1` in the path, and every change below landed
  inside that version. No entry in the published window is marked breaking; the two removals are
  response-field removals for a page type Instapage retired from the product.
window:
  first: '2025-02-27'
