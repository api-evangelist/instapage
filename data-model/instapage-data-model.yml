cascades:
- operation: deletePage
  effect: >-
    Deletes all personalizations and the default experience of the page. Blocked while any experiment
    on the page or on a personalized experience is running.
- operation: deleteGroup
  effect: Blocked while the group still contains pages.
- operation: deleteWorkspace
  effect: Deletes the workspace; the API documents no per-child confirmation.
- operation: deleteFormSubmissions
  effect: Irreversible deletion of lead records. No undo, no soft-delete.
soft_delete:
  entity: Page
  field: isDeleted
  filter: 'GET /workspaces/{workspaceId}/pages?isDeleted=true'
  note: Pages carry an isDeleted flag and deleted pages remain listable via the filter.
