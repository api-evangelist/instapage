summary: >-
  Entity-relationship graph derived from the Instapage Public API path hierarchy, schema $refs and
  id-reference fields. The workspace is the root tenant: almost every resource is addressed as
  /workspaces/{workspaceId}/..., and IDs are numeric integers with no type prefix, so an ID is only
  meaningful inside its workspace.
id_convention:
  type: numeric
  prefixes: false
  note: >-
    Instapage uses bare numeric IDs (workspaceId, pageId, groupId, collectionId, collectionPageId,
    folderId, experimentId, userId). Form submission IDs and personalizationId are strings. There is
    no type-prefixed identifier scheme, so an agent cannot infer a resource type from an ID alone.
entities:
- name: Workspace
  key: workspaceId
  root: true
  description: Top-level tenant container. Holds pages, integrations, domains and other assets.
  operations: [listWorkspaces, getWorkspace, createWorkspace, renameWorkspace, deleteWorkspace]
- name: TeamMember
  key: userId
  description: A person with access to a workspace, at viewer / editor / manager / owner level.
  operations: [listTeamMembers, inviteTeamMembers, updateTeamMembers, removeTeamMembers]
- name: Page
  key: id
  description: A landing page. Types are standard, amp, wordpress, drupal.
  operations: [listPages, getPage, searchPages, updatePage, deletePage, publishPage,
    updatePublishedPageUrl, unpublishPage, exportPageAsJson, createPageFromJson]
- name: Group
  key: id
  description: A folder that organises pages inside a workspace. Must be empty to delete.
  operations: [listGroups, createGroup, updateGroup, deleteGroup]
- name: Personalization
  key: personalizationId
  description: A personalized experience variant of a page for an audience segment.
  operations: [listPersonalizations]
- name: Collection
  key: id
  description: A set of pages sharing one template, differentiated by named placeholders.
  operations: [listCollections, getCollection]
- name: CollectionPlaceholder
  key: name
  description: A named text or image slot in a collection template, with a default value object.
  embedded_in: Collection
- name: CollectionPage
  key: id
  description: An individual page inside a collection with its own URL and placeholder values.
  operations: [listCollectionPages, createCollectionPage, publishCollectionPage,
    unpublishCollectionPage, deleteCollectionPage]
- name: Experiment
  key: experimentId
  description: A Manual or AI experiment on a page, in DRAFT / RUNNING / ENDED / ARCHIVED state.
  operations: [listExperiments]
- name: Submission
  key: id
  description: A lead captured by a form on a landing page. Carries arbitrary form fields.
  pii: true
  operations: [retrieveFormSubmissions, deleteFormSubmissions]
- name: AnalyticsRow
  key: key
  description: An aggregated visit/conversion/lead row, keyed by pageId, date and/or variationId.
  operations: [getAnalytics]
- name: Domain
  key: id
  description: A custom domain connected to a workspace, with connection and SSL status.
  operations: [listDomains]
- name: ImageFolder
  key: folderId
  description: A folder of image assets in a workspace. May be a system folder or read-only.
  operations: [listImageFolders]
- name: Image
  key: id
  description: An uploaded image asset, with URI, thumbnail, filename and alt text.
  operations: [listImagesInFolder, uploadImage]
