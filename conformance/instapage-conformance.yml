summary: >-
  Cross-cutting standards conformance for the Instapage Public API v1, derived from the transcribed
  OpenAPI and the published developer reference. Instapage's API is a plain bearer-token REST
  surface: it implements none of the interoperability standards below, and its compliance posture is
  organizational (SOC 2, ISO-aligned, GDPR/CCPA) rather than protocol-level.
standards:
- id: rest
  conforms: true
  evidence: >-
    Resource-oriented URIs under /v1, HTTP verbs GET/POST/PUT/PATCH/DELETE, JSON request and response
    bodies.
- id: openapi
  conforms: false
  evidence: >-
    Instapage publishes no OpenAPI or Swagger description. /openapi.json, /openapi.yaml,
    /swagger.json, /api-docs, /docs and /redoc all 404 on api.instapage.com and devdocs.instapage.com.
    The specs in openapi/ are API Evangelist transcriptions of the human reference.
- id: http-bearer-rfc6750
  conforms: true
  evidence: 'Authorization: Bearer <personal API token> on every request; 401 on expired or revoked
    tokens.'
- id: oauth2
  conforms: false
  evidence: >-
    No authorization server, no authorize/token endpoints, no client registration. Authentication is
    a long-lived personal token only.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration 404s on every Instapage host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a proprietary {title, details, meta} envelope with content-type application/json, not
    application/problem+json, and carry no `type` URI or machine-readable code.
- id: json-api
  conforms: false
  evidence: >-
    Responses do use a top-level `data` key and a `meta` block, but there is no `type`/`id` resource
