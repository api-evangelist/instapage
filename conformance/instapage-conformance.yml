- id: odata
  conforms: false
- id: scim
  conforms: false
  evidence: >-
    Team member management is a proprietary bulk-array API at /workspaces/{id}/team-members, not
    SCIM 2.0 /Users or /Groups.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    No /.well-known/security.txt on any Instapage host. Coordinated disclosure runs through the
    parent company's HackerOne programme instead.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header support and no published deprecation policy.
- id: rfc8615-well-known
  conforms: false
  evidence: >-
