            Retry-After:
              description: Number of seconds to wait before retrying, returned when the daily plan quota
                or the 200 requests/minute limit is exceeded.
              schema:
                type: integer
        '500':
          description: Internal Server Error. An error occurred on the server that prevented the folders
            from being retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /workspaces/{workspaceId}/assets/images/folders/{folderId}/items:
    get:
      summary: Get images in folder
      description: Get the list of images in a specific folder within a workspace's image assets.
      operationId: listImagesInFolder
      tags:
      - Assets
      parameters:
      - *id001
      - in: path
        name: folderId
        required: true
        description: The ID of the folder to retrieve images from.
        schema:
          type: number
      - *id002
      responses:
        '200':
          description: OK. The images were retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Image'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Bad request. The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. Authentication failed or missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden. The user does not have permission to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found. The folder could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests. Request was blocked due to rate limit or plan restrictions.
            See the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying, returned when the daily plan quota
                or the 200 requests/minute limit is exceeded.
              schema:
                type: integer
        '500':
          description: Internal Server Error. An error occurred on the server that prevented the images
            from being retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Upload image
      description: Upload an image to a specific folder within a workspace's image assets, using multipart/form-data
        with the file field named 'image'.
      operationId: uploadImage
      tags:
      - Assets
      parameters:
      - *id001
      - in: path
        name: folderId
        required: true
        description: The ID of the folder to upload the image to.
        schema:
          type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload.
      responses:
        '201':
          description: Created. The image was uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imageId:
                        type: number
                        description: Unique identifier of the uploaded image.
                      folderId:
                        type: number
                        description: ID of the folder the image was uploaded to.
                      title:
                        type: string
                        description: Filename of the uploaded image.
        '400':
          description: Bad Request. Invalid input parameters, wrong file format, or file too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. Authentication failed or missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden. User doesn't have necessary permissions for this folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found. The specified workspace or folder could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests. Request was blocked due to rate limit or plan restrictions.
            See the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying, returned when the daily plan quota
                or the 200 requests/minute limit is exceeded.
              schema:
                type: integer
        '500':
          description: Internal Server Error. An unexpected condition prevented the request from being
            fulfilled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Personal API Token
      description: 'Personal API token generated from Instapage account settings, sent as `Authorization:
        Bearer <token>`.'
  schemas:
    Pagination:
      type: object
      properties:
        currentPage:
          type: number
          description: Number of the current page of results.
        perPage:
          type: number
          description: Number of items per page.
        totalItemsCount:
          type: number
          description: Total number of items.
        totalPagesCount:
          type: number
          description: Total number of pages.
        nextPage:
          type:
          - number
          - 'null'
          description: Number of the next page, null if there is no next page.
        previousPage:
          type:
          - number
          - 'null'
          description: Number of the previous page, null if there is no previous page.
    PaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
    Error:
      type: object
      description: Error envelope returned by the Instapage API.
      properties:
        title:
          type: string
          description: The type of error that occurred.
        details:
          type: string
          description: A human-readable description of the error.
        meta:
          type: object
          properties:
            requestedUserId:
              type: number
              description: ID of the user who made the request.
            requestedWorkspaceId:
              type: number
              description: ID of the workspace involved.
            requestedPageId:
              type: number
              description: ID of the page involved, when the error concerns a page.
    Workspace:
      type: object
      properties:
        workspaceId:
          type: number
          description: Unique identifier of the workspace.
        ownerId:
          type: number
          description: Identifier of the workspace owner.
        workspaceName:
          type: string
          description: Name of the workspace.
        accessLevel:
          type: string
          description: User's access level to the workspace.
        createdAt:
          type: number
          description: Creation date of the workspace in UNIX timestamp format.
    TeamMember:
      type: object
      properties:
        userId:
          type: number
          description: Unique identifier of the team member.
        email:
          type: string
          description: Email address of the team member.
        invitedAt:
          type:
          - number
          - 'null'
          description: Timestamp when the team member was invited (null if owner).
        fullName:
          type:
          - string
          - 'null'
          description: Full name of the team member. Null if invitationStatus is 'pending'.
        accessLevel:
          type: string
          description: Access level of the team member.
          enum:
          - viewer
          - editor
          - manager
          - owner
        inheritOwnerContextInPublicApi:
          type: boolean
          description: Whether the member's public API usage should consume the owner's quota.
        invitationStatus:
          type: string
          description: Status of the invitation.
          enum:
          - accepted
          - pending
        lastLoginAt:
          type:
          - number
          - 'null'
          description: Timestamp of the team member's last login.
        lastActivityInWorkspaceAt:
          type:
          - number
          - 'null'
          description: Timestamp of the team member's last activity in the workspace.
    Page:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the page.
        title:
          type: string
          description: Title of the page.
        url:
          type:
          - string
          - 'null'
          description: URL where the page is published (null if unpublished).
        publishStatus:
          type: string
          description: Current publish status.
          enum:
          - published
          - unpublished
          - publishedHasChanges
        publishMethod:
          type:
          - string
          - 'null'
          description: Method used for publishing.
          enum:
          - cmsPlugin
          - customDomain
          - pageDemo
          - null
        createdAt:
          type: number
          description: Creation timestamp (UNIX format).
        updatedAt:
          type: number
          description: Last update timestamp (UNIX format).
        publishedAt:
          type:
          - number
          - 'null'
          description: Publication timestamp (UNIX format), null if unpublished.
        isDeleted:
          type: boolean
          description: Indicates if the page has been deleted.
        pageType:
          type: string
          description: Type of page.
          enum:
          - amp
          - standard
          - wordpress
          - drupal
        totalPersonalizedExperienceCount:
          type: number
          description: Number of personalized experiences for this page.
        isScheduled:
          type: boolean
          description: Indicates if the page has scheduled publishing.
        groupId:
          type:
          - number
          - 'null'
          description: Id of the group the page belongs to.
    Group:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the group (folder).
        name:
          type: string
          description: Name of the group (folder).
        pages:
          type: array
          description: IDs of the pages in the group.
          items:
            type: number
    Personalization:
      type: object
      properties:
        pageId:
          type: number
          description: Unique identifier of the page.
        personalizationId:
          type: string
          description: Unique identifier for the personalization experience.
        title:
          type: string
          description: Title of the page.
        publishStatus:
          type: string
          description: Current publish status of the page.
        createdAt:
          type: number
          description: Creation timestamp of the page (UNIX format).
        url:
          type: string
          description: URL where the page is published.
        publishMethod:
          type: string
          description: Method used for publishing the page.
        isDefaultPersonalization:
          type: boolean
          description: Indicates whether this is the default personalization experience.
        isScheduled:
          type: boolean
          description: Indicates whether the page is scheduled for publication.
    CollectionPlaceholder:
      type: object
      properties:
        name:
          type: string
          description: Name of the placeholder.
        type:
          type: string
          description: Type of the placeholder.
          enum:
          - text
          - image
        defaultValueObject:
          type: object
          description: Default value for the placeholder. Structure varies based on type.
          properties:
            textValue:
              type:
              - string
              - 'null'
              description: Text value, present if type is 'text'.
            mediaIndexId:
              type:
              - number
              - 'null'
              description: Id of the image used, present if type is 'image'.
            src:
              type:
              - string
              - 'null'
              description: Source URL of the image, present if type is 'image'.
            thumbnail:
              type:
              - string
              - 'null'
              description: Thumbnail URL of the image, present if type is 'image'.
            title:
              type:
              - string
              - 'null'
              description: Title of the image, present if type is 'image'.
    Collection:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the collection.
        name:
          type: string
          description: Name of the collection.
        placeholders:
          type: array
          description: List of placeholders for the collection.
          items:
            $ref: '#/components/schemas/CollectionPlaceholder'
        pagesCount:
          type: object
          description: Count of pages in the collection.
          properties:
            all:
              type: number
              description: Total number of pages in the collection.
            published:
              type: number
              description: Number of published pages in the collection.
    CollectionPage:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the collection page.
        name:
          type: string
          description: Name of the collection page.
        status:
          type: string
          description: Publication status of the collection page.
          enum:
          - not_published
          - published
          - published_has_changes
        url:
          type: string
          description: Full URL of the collection page.
        draftUrlSuffix:
          type:
          - string
          - 'null'
          description: URL suffix for the draft version of the page.
        publicUrlSuffix:
          type:
          - string
          - 'null'
          description: URL suffix for the published version of the page.
        draftBaseUrl:
          type: string
          description: Base URL for draft pages within the collection.
        publicBaseUrl:
          type:
          - string
          - 'null'
          description: Base URL for published pages within the collection.
    Experiment:
      type: object
      properties:
        experimentId:
          type: number
          description: Unique identifier for the experiment.
        experimentName:
          type: string
          description: Name of the experiment.
        pageId:
          type: number
          description: ID of the page associated with the experiment.
        publishedPageUrl:
          type: string
          description: URL where the experiment page is published.
        experimentType:
          type: string
          description: Type of experiment.
          enum:
          - Manual
          - AI
        experimentStatus:
          type: string
          description: Current status of the experiment.
          enum:
          - DRAFT
          - RUNNING
          - ENDED
          - ARCHIVED
        createdAt:
          type: number
          description: Creation timestamp (UNIX format).
        createdBy:
          type: number
          description: User ID of the experiment creator.
        startedAt:
          type:
          - number
          - 'null'
          description: Start timestamp (UNIX format), null if not started.
        endedAt:
          type:
          - number
          - 'null'
          description: End timestamp (UNIX format), null if not ended.
    AnalyticsRow:
      type: object
      properties:
        key:
          type: object
          description: Object containing unique identifiers. Structure varies based on the request grouping.
          properties:
            pageId:
              type: number
              description: Page ID, part of the key.
            date:
              type: number
              description: Date in UNIX timestamp (seconds), part of the key.
            variationId:
              type: number
              description: Variation ID, part of the key.
        visit:
          type: number
          description: Total number of visits associated with the key.
        conversion:
          type: number
          description: Total number of conversions associated with the key.
        leads:
          type: number
          description: Total number of leads associated with the key.
    Submission:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the submission.
        pageId:
          type: number
          description: ID of the page related to the submission.
        variationName:
          type: string
          description: Name of the variation used for the submission.
        variationCustomName:
          type: string
          description: Custom name of the variation used for the submission.
        createdAt:
          type: number
          description: Timestamp (in UNIX seconds) of when the submission was created.
        fields:
          type: object
          description: Key-value pairs representing submission fields.
          additionalProperties: true
    Domain:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the domain.
        subdomain:
          type: string
          description: Subdomain part (preceding the main domain).
        domain:
          type: string
          description: Main domain name.
        connection:
          type: string
          description: Connection status of the domain.
          enum:
          - connected
          - accessRequested
          - accessRequestDenied
          - accessProvided
        ssl:
          type: string
          description: SSL certificate status.
        custom404:
          type:
          - object
          - 'null'
          description: Custom 404 page configuration, null if not configured.
          properties:
            type:
              type: string
              enum:
              - outside
              - landingpage
              description: Type of 404 page configuration.
            id:
              type:
              - number
              - 'null'
              description: Id of the landing page associated with the 404 page configuration.
            url:
              type:
              - string
              - 'null'
              description: Url of the outside website associated with the 404 page configuration.
    ImageFolder:
      type: object
      properties:
        folderId:
          type:
          - number
          - string
          description: Unique identifier of the folder.
        folderName:
          type: string
          description: Name of the folder.
        systemFolder:
          type: boolean
          description: Indicates if the folder is a system folder and cannot be deleted.
        readOnly:
          type: boolean
          description: Indicates if the folder is read-only. Uploads and image deletion are prohibited
            in this mode.
    Image:
      type: object
      properties:
        id:
          type: number
          description: Unique identifier of the image.
        folderId:
          type: number
          description: ID of the folder containing the image.
        uri:
          type: string
          description: Full URL to the image.
        thumbnail:
          type: string
          description: URL to the thumbnail version of the image.
        fileName:
          type: string
          description: Original filename of the image.
        altText:
          type:
          - string
          - 'null'
          description: Alternative text for the image, null if not set.
