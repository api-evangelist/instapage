                  - hourly
                  - monthly
                  - yearly
                  description: Time interval for aggregating data.
                device:
                  type: string
                  default: any
                  enum:
                  - any
                  - desktop
                  - mobile
                  description: Device type filter.
                timeframe:
                  type: object
                  properties:
