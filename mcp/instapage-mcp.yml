safety_notes:
- delete_form_submissions is irreversible and handles lead PII — gate behind human confirmation.
- delete_page cascades to all personalizations and the default experience.
- publish_page / unpublish_page clear any scheduling configured on the page.
- Every write operation is subject to the 200 req/min limit and the daily plan quota; there is no
  idempotency key, so a naive retry can duplicate an effect.
