summary: >-
  Instapage ships NO first-party client SDK for the Public API in any language. The developer
  reference teaches the API entirely through hand-rolled curl / fetch / PHP cURL snippets in shell,
  JavaScript, TypeScript and PHP — there is no `npm install`, no `pip install`, no packaged client
  anywhere in the docs. The one first-party package published under the Instapage name is an internal
  logging library, not an API client. Everything installable that wraps the API is third-party.
