aid: instapage
name: Instapage
description: Instapage is a landing page and post-click optimization platform that lets marketers build,
  personalize, A/B test, and analyze landing pages used in paid advertising and conversion campaigns.
  The platform includes a drag and drop builder, AdMap for ad-to-page connection, heatmaps, experiments,
  and AI-powered content generation, and integrates with major ad platforms, CRMs, and marketing automation
  tools. Instapage's REST API provides programmatic access to landing pages, leads, accounts, and team
  members using a Personal API Token for authentication.
