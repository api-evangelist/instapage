apis:
- aid: instapage:public-api
  name: Instapage Public API
  description: The Instapage Public API is a REST API over the Instapage landing page and post-click optimization
    platform, exposing workspaces, team members, landing pages, page groups, personalized experiences,
    collections and collection pages, experiments, analytics, form submissions (leads), custom domains
    and image assets across 39 documented operations. Authentication is a Personal API Token sent as an
    HTTP Bearer token; rate limiting is 200 requests per minute per token and per IP on top of a plan-tiered
    daily quota (5,000 calls/day on Create, 10,000 on Optimize) that resets at 00:00 UTC.
  humanURL: https://devdocs.instapage.com/
  baseURL: https://api.instapage.com/v1
